---
# OpenVox Server comes from the openvox8 collection, as ovadm installed it.
# No version is pinned, so the first Puppet run keeps what ovadm installed.
openvox_server::collection: 'openvox8'

# codavox on every server that compiles catalogs. basedir is r10k's basedir.
codavox::package_ensure: '0.11.0'
codavox::basedir: '/etc/puppetlabs/code/environments'
codavox::publish_allow_roles:
  - 'openvox_compiler'

# Keep Puppet running on every node. openvox_server declares openvox_agent on
# the servers; role::agent includes it everywhere else.
openvox_agent::service_ensure: 'running'
openvox_agent::service_enable: true
